[package]
name = "sleigh-compiler"
version = "2.0.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mnemonikr/sleigh-compiler"
description = "Rust bindings for the Ghidra SLEIGH compiler. Used to compile processor .slaspec files into .sla files"
categories = ["security", "compilers", "api-bindings"]

# List includes to avoid including entire Ghidra submodule
include = [
    "/build.rs",
    "/src/*",
    "/ghidra/Ghidra/Features/Decompiler/src/decompile/cpp/*",
    "/ghidra/Ghidra/Features/Decompiler/src/decompile/zlib/*",
    "/ghidra/DISCLAIMER.md",
    "/ghidra/NOTICE",
    "/ghidra/LICENSE",
    "/ghidra/licenses/*",
]

[dependencies]
cxx = "1.0"
thiserror = "2.0"
libsla-sys = "0.1"

[build-dependencies]
cxx-build = "1.0"

# libsla-sys stating its headers (0verflowme/libsla-sys#2, merged) until a release has it.
# Ghidra 918acd744d's headers until 0verflowme/libsla-sys#6 merges; then back to `main`.
[patch.crates-io]
libsla-sys = { git = "https://github.com/0verflowme/libsla-sys", branch = "context-targets" }
